name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARCHGATE_TELEMETRY: "0"

jobs:
  validate:
    name: Lint, Test & Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore Bun Package Cache
        id: restore-bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.bun/install/cache
          key: bun-packages-${{ runner.os }}-v1-${{ hashFiles('bun.lock') }}
      - uses: ./.github/actions/setup-bun-project
        with:
          cache: "true"
          cache-base: main
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bun run commitlint
      - name: Check llms-full.txt is up to date
        run: |
          bun run docs/scripts/generate-llms-full.ts
          git diff --exit-code docs/public/llms-full.txt || {
            echo "::error::docs/public/llms-full.txt is out of date. Run 'bun run docs/scripts/generate-llms-full.ts' and commit the result."
            exit 1
          }
      - name: Audit dependencies
        # Not part of `bun run validate`: that runs in the pre-push hook, which
        # must work offline. CI always has network, so the advisory check lives
        # here (ARCH-006).
        run: bun run audit
      - name: Validate
        id: validate
        run: bun run validate:coverage
      - name: Upload coverage
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage/lcov.info
          retention-days: 1
      - name: Save Bun Cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.validate.outcome == 'success' && steps.restore-bun-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/.bun/install/cache
          key: ${{ steps.restore-bun-cache.outputs.cache-primary-key }}

  shim-changes:
    name: Detect Shim Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      shims_changed: ${{ steps.changes.outputs.shims_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for shim changes
        id: changes
        env:
          # Passed via env, not inlined into the script, to avoid template-injection
          # (zizmor: code injection via template expansion).
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Detect changes to shim source code AND workflow files that configure
          # shim test/publish infrastructure (e.g., action version bumps, runtime
          # version changes). Without checking workflow files, a Renovate PR that
          # bumps Ruby 3.3→3.4 in the shim-tests job would skip tests entirely.
          PATHS=(shims/ .github/workflows/publish-shims.yml .github/workflows/code-pull-request.yml)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- "${PATHS[@]}" || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 -- "${PATHS[@]}" || true)
          fi
          if [ -n "$CHANGED" ]; then
            echo "shims_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "shims_changed=false" >> "$GITHUB_OUTPUT"
          fi

  shim-tests:
    name: Shim Tests (${{ matrix.shim }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: shim-changes
    if: needs.shim-changes.outputs.shims_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shim: [npm, pypi, go, maven, nuget, rubygem, winget]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --- npm (Node.js pre-installed on ubuntu-latest) ---
      - name: Test npm shim
        if: matrix.shim == 'npm'
        run: node --test shims/npm/test/archgate.test.cjs
      # --- PyPI ---
      - name: Setup Python
        if: matrix.shim == 'pypi'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test PyPI shim
        if: matrix.shim == 'pypi'
        working-directory: shims/pypi
        run: python -m unittest discover tests/
      # --- Go ---
      - name: Setup Go
        if: matrix.shim == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
          cache-dependency-path: shims/go/go.sum
      - name: Test Go shim
        if: matrix.shim == 'go'
        working-directory: shims/go
        run: go test ./...
      # --- Maven ---
      - name: Setup Java
        if: matrix.shim == 'maven'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "11"
      - name: Test Maven shim
        if: matrix.shim == 'maven'
        working-directory: shims/maven
        run: mvn test -B
      # --- NuGet ---
      - name: Setup .NET
        if: matrix.shim == 'nuget'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Test NuGet shim
        if: matrix.shim == 'nuget'
        working-directory: shims/nuget/tests/Archgate.Tool.Tests
        run: dotnet test
      # --- RubyGem ---
      - name: Setup Ruby
        if: matrix.shim == 'rubygem'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
      - name: Test RubyGem shim
        if: matrix.shim == 'rubygem'
        working-directory: shims/rubygem
        run: bundle install --jobs 4 && bundle exec ruby test/test_shim.rb
      # --- winget (cross-compiles the Go shim; the build script runs on Bun) ---
      - name: Setup Go
        if: matrix.shim == 'winget'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
          cache: false
      - uses: ./.github/actions/setup-bun-project
        if: matrix.shim == 'winget'
      - name: Generate winget artifacts
        if: matrix.shim == 'winget'
        run: bun run build:winget --out-dir dist/winget
      - name: Verify winget artifacts
        if: matrix.shim == 'winget'
        run: |
          EXE=dist/winget/archgate-shim-win32-x64.exe
          if [ ! -f "$EXE" ]; then
            echo "::error::Shim executable was not produced at $EXE"
            exit 1
          fi
          if ! file "$EXE" | grep -q "PE32+"; then
            echo "::error::$EXE is not a Windows PE executable"
            file "$EXE"
            exit 1
          fi
          MANIFEST_COUNT=$(find dist/winget -name '*.yaml' | wc -l)
          if [ "$MANIFEST_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 rendered manifests, found $MANIFEST_COUNT:"
            find dist/winget -name '*.yaml'
            exit 1
          fi
          # `grep -l` exits non-zero when nothing matches, which is the passing
          # case here, so the step's `set -e` needs an explicit fallback.
          UNSUBSTITUTED=$(find dist/winget -name '*.yaml' -exec grep -l '{{' {} + || true)
          if [ -n "$UNSUBSTITUTED" ]; then
            echo "::error::Rendered manifest still contains an unsubstituted placeholder: $UNSUBSTITUTED"
            exit 1
          fi
          echo "Generated winget artifacts:"
          ls -la dist/winget

  smoke-windows:
    name: Smoke Test (Windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/smoke-test-windows.yml

  smoke-linux:
    name: Smoke Test (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/smoke-test-linux.yml

  # Uploads findings to the Security tab (GitHub Advanced Security, free for
  # public repos) rather than failing the build — there's an existing
  # unreviewed findings backlog across several workflow files. Once that's
  # triaged, this can be promoted to a hard gate via code-scanning merge
  # protection (repo Settings, not this workflow).
  zizmor:
    name: Zizmor (Workflow Security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read # actions/checkout
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        # Fork PRs get a read-only GITHUB_TOKEN regardless of the
        # `permissions:` above, so SARIF upload would fail — fall back to
        # console-only output and don't let that (or the pre-existing
        # findings backlog) fail the gate for external contributors.
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        with:
          config: zizmor.yml
          advanced-security: ${{ github.event.pull_request.head.repo.fork != true }}

  # Validates workflow schema (zizmor covers security patterns only). See CI-002.
  actionlint:
    name: Actionlint (Workflow Schema)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read # actions/checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        # Direct binary download with SHA-256 verification, pinned version — see
        # CI-002. No download-then-run script: release assets are mutable, so the
        # checksum (from the release's checksums.txt) is what makes this
        # reproducible (Scorecard Pinned-Dependencies).
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: ./actionlint -color

  # Publishes ADR violations to the Security tab (code scanning) so findings are
  # visible in GitHub rather than buried in the `validate` job log. This job is
  # reporting-only: `validate` runs the same check and is what gates the merge,
  # so a violation here must still upload rather than abort the job.
  archgate-sarif:
    name: Archgate SARIF (Code Scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read # actions/checkout
      security-events: write # upload-sarif
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the configured `baseBranch` (origin/main) resolves
          # for change-scoped rules.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-project
      - name: Run archgate check (SARIF)
        # `check` exits 1 on violations, and strict mode (`.archgate/config.json`)
        # also escalates advisory findings — the results must still reach the
        # Security tab in exactly that case, so don't let it fail the job.
        continue-on-error: true
        # Written outside the working tree: GEN-005 allowlists the repository
        # root, and a stray `.sarif` there would fail the very check producing it.
        run: bun run cli check --output sarif > "$RUNNER_TEMP/archgate.sarif"
      - name: Upload SARIF to GitHub Security tab
        # Fork PRs get a read-only GITHUB_TOKEN regardless of the `permissions:`
        # above, so the upload is rejected — don't fail the gate for external
        # contributors.
        if: success() || failure()
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/archgate.sarif
          # Distinct category keeps these results from overwriting the other
          # SARIF producers in this repo (CodeQL, zizmor, Scorecard).
          category: archgate

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: always() && needs.validate.result == 'success'
    needs: [validate, smoke-windows]
    permissions:
      contents: read
      pull-requests: write # coverage-report posts the coverage comment on the PR
    env:
      # Single source of truth for the gate. The coverage-report action performs
      # the comparison and reports the verdict back as its threshold-met output;
      # this value is repeated here only to phrase the failure message.
      MIN_COVERAGE: "99.9"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Linux coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-linux
          path: coverage-linux
      - name: Download Windows coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-windows
          path: coverage-windows
        continue-on-error: true
      - name: Merge coverage and generate report
        id: coverage-report
        uses: ./.github/actions/coverage-report
        with:
          min-coverage: ${{ env.MIN_COVERAGE }}
          github-token: ${{ github.token }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.pull_request.number }}
          is-fork: ${{ github.event.pull_request.head.repo.fork }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Upload coverage report
        if: always() && steps.coverage-report.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ steps.coverage-report.outputs.html-report-path }}
          retention-days: 30
      - name: Enforce coverage threshold
        if: always() && steps.coverage-report.outcome == 'success'
        env:
          # Passed via env, not inlined into the script, to avoid template-injection
          # (zizmor: code injection via template expansion).
          COVERAGE: ${{ steps.coverage-report.outputs.coverage }}
          THRESHOLD_MET: ${{ steps.coverage-report.outputs.threshold-met }}
        run: |
          # Test against the affirmative value so an empty or absent output
          # fails the gate rather than passing it.
          if [ "$THRESHOLD_MET" != "true" ]; then
            echo "::error::Code coverage is ${COVERAGE}%, which is below the minimum threshold of ${MIN_COVERAGE}%."
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets the minimum threshold of ${MIN_COVERAGE}%."

  # Gate job — single required status check for branch protection.
  status:
    name: Validate Code
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        validate,
        shim-changes,
        shim-tests,
        smoke-windows,
        smoke-linux,
        zizmor,
        actionlint,
        archgate-sarif,
        coverage,
      ]
    steps:
      - name: Check job results
        run: |
          # shim-tests is skipped when no shim files changed — treat skipped as success.
          SHIM_OK="${{ needs.shim-tests.result }}"
          if [[ "$SHIM_OK" == "skipped" ]]; then SHIM_OK="success"; fi

          if [[ "${{ needs.validate.result }}" != "success" ]] || \
             [[ "$SHIM_OK" != "success" ]] || \
             [[ "${{ needs.smoke-windows.result }}" != "success" ]] || \
             [[ "${{ needs.smoke-linux.result }}" != "success" ]] || \
             [[ "${{ needs.zizmor.result }}" != "success" ]] || \
             [[ "${{ needs.actionlint.result }}" != "success" ]] || \
             [[ "${{ needs.archgate-sarif.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "::error::One or more jobs failed:"
            echo "  validate: ${{ needs.validate.result }}"
            echo "  shim-tests: ${{ needs.shim-tests.result }}"
            echo "  smoke-windows: ${{ needs.smoke-windows.result }}"
            echo "  smoke-linux: ${{ needs.smoke-linux.result }}"
            echo "  zizmor: ${{ needs.zizmor.result }}"
            echo "  actionlint: ${{ needs.actionlint.result }}"
            echo "  archgate-sarif: ${{ needs.archgate-sarif.result }}"
            echo "  coverage: ${{ needs.coverage.result }}"
            exit 1
          fi
          echo "All checks passed."

name: Publish Shims

# No `release: published` trigger — release-binaries.yml dispatches this via
# `gh workflow run` once binaries are actually uploaded. Avoids racing a
# fixed-budget wait against a build that may need a retry (see CLAUDE.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish shims for (e.g. v0.39.0)"
        required: true

permissions: {}

env:
  ARCHGATE_TELEMETRY: "0"

jobs:
  # Sanity-check assets are present (covers GitHub API read-after-write lag).
  wait-for-binaries:
    name: Wait for binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify release assets are present
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          REQUIRED_ASSETS=("archgate-darwin-arm64.tar.gz" "archgate-linux-x64.tar.gz" "archgate-win32-x64.zip" "archgate-win32-x64.msix")
          for i in $(seq 1 10); do
            ASSETS=$(gh release view "$TAG" --repo archgate/cli --json assets --jq '.assets[].name')
            ALL_FOUND=true
            for asset in "${REQUIRED_ASSETS[@]}"; do
              if ! echo "$ASSETS" | grep -qF "$asset"; then
                ALL_FOUND=false
                break
              fi
            done
            if $ALL_FOUND; then
              echo "All required release assets found"
              exit 0
            fi
            echo "Waiting for release assets... attempt $i/10"
            sleep 15
          done
          echo "::error::Required binaries for $TAG are still missing after 10 checks (~2.5 min)."
          echo "::error::This workflow expects release-binaries.yml to have already succeeded for this tag."
          echo "::error::Check the Release Binaries run for $TAG, then re-run: gh workflow run publish-shims.yml -f tag=$TAG"
          exit 1

  publish-pypi:
    needs: wait-for-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # PyPI trusted publishers (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          # No cache in a publish workflow — a poisoned cache entry could end up
          # inside the published artifact (zizmor: cache-poisoning).
          enable-cache: false
      - name: Build package
        working-directory: shims/pypi
        # `uv build` provisions an isolated, version-pinned build environment
        # itself — no unpinned `pip install build` (Scorecard Pinned-Dependencies).
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: shims/pypi/dist/

  publish-nuget:
    needs: wait-for-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # NuGet trusted publishers (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: rhuan.barreto
      - name: Pack and publish
        working-directory: shims/nuget/Archgate.Tool
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet pack -c Release
          dotnet nuget push bin/Release/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"

  publish-go-tag:
    needs: wait-for-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write is required to push a tag. See
    # project_release_pipeline_gotchas.md for why there's no "workflows" scope.
    permissions:
      contents: write
    steps:
      # Credentials must persist: the next step pushes the Go module tag via git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ inputs.tag }}
      - name: Create Go module tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          GO_TAG="shims/go/${TAG}"
          git tag "$GO_TAG"
          git push origin "$GO_TAG"

  publish-maven:
    needs: wait-for-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "11"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Build and publish
        working-directory: shims/maven
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn clean deploy -P release -B --no-transfer-progress

  # Submits the release's MSIX to the Microsoft Store, which certifies and
  # signs it (ARCH-017). It fails loudly rather than continue-on-error: no
  # other publish job depends on it, and a silent failure would let the Store
  # drift versions behind unnoticed. Sign-in is GitHub OIDC federation through
  # the `microsoft-store` environment, so no Partner Center secret is stored.
  publish-msstore:
    needs: wait-for-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: microsoft-store
    permissions:
      contents: read
      id-token: write # Entra workload identity federation (OIDC)
    env:
      CLIENT_ID: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
      TENANT_ID: ${{ vars.PARTNER_CENTER_TENANT_ID }}
    steps:
      - name: Check Partner Center configuration
        id: config
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ]; then
            echo "::warning::PARTNER_CENTER_CLIENT_ID / PARTNER_CENTER_TENANT_ID are not configured - skipping the Microsoft Store submission."
            echo "::warning::See distribution/msix/README.md for the Partner Center setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.configured == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: $/.github/actions/setup-bun-project
        if: steps.config.outputs.configured == 'true'

      - name: Sign in to Microsoft Entra
        if: steps.config.outputs.configured == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
          tenant-id: ${{ vars.PARTNER_CENTER_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Submit MSIX to the Microsoft Store
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo archgate/cli --pattern archgate-win32-x64.msix
          # The submission API takes the package inside a ZIP archive.
          zip submission.zip archgate-win32-x64.msix

          PARTNER_CENTER_ACCESS_TOKEN=$(az account get-access-token \
            --resource https://manage.devcenter.microsoft.com \
            --query accessToken --output tsv)
          echo "::add-mask::$PARTNER_CENTER_ACCESS_TOKEN"
          export PARTNER_CENTER_ACCESS_TOKEN

          bun run publish:msstore --archive submission.zip

  publish-rubygem:
    needs: wait-for-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # RubyGems trusted publishers (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.7"
          # No bundler cache in a publish workflow — a poisoned cache entry could
          # end up inside the published gem (zizmor: cache-poisoning).
          bundler-cache: false
          working-directory: shims/rubygem
      - name: Install dependencies
        working-directory: shims/rubygem
        run: bundle install --jobs 4
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          working-directory: shims/rubygem

name: Smoke Test (Windows)

on:
  workflow_call:

permissions:
  contents: read

env:
  ARCHGATE_TELEMETRY: "0"

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-bun-project

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Tests
        id: tests
        # `test:coverage`, not `test --coverage`: `test` carries `--parallel`,
        # and a multi-process run inflates the lines-found denominator that the
        # merged 99.9% gate is calibrated against (ARCH-005).
        run: bun run test:coverage
      - name: Upload coverage
        if: always() && steps.tests.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage/lcov.info
          retention-days: 1

      - name: Build Windows binary
        run: bun build src/cli.ts --compile --bytecode --compile-exec-argv=--use-system-ca --outfile dist/archgate-smoke-test

      - name: Smoke test binary
        shell: pwsh
        run: |
          $binary = "dist/archgate-smoke-test.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "Binary not found at $binary"
            exit 1
          }
          $output = & $binary --version 2>&1
          Write-Host "archgate version: $output"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Binary exited with code $LASTEXITCODE"
            exit 1
          }

      - name: Smoke test binary from install dir
        shell: pwsh
        run: |
          $installDir = Join-Path $env:APPDATA "archgate"
          New-Item -Path $installDir -ItemType Directory -Force | Out-Null
          Copy-Item "dist/archgate-smoke-test.exe" (Join-Path $installDir "archgate.exe")
          $output = & (Join-Path $installDir "archgate.exe") --version 2>&1
          Write-Host "archgate version from binary install dir: $output"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Binary exited with code $LASTEXITCODE"
            exit 1
          }
          Remove-Item -Path $installDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Smoke test binary from proto dir
        shell: pwsh
        run: |
          $protoDir = Join-Path $env:USERPROFILE ".proto" "tools" "archgate" "0.0.0"
          New-Item -Path $protoDir -ItemType Directory -Force | Out-Null
          Copy-Item "dist/archgate-smoke-test.exe" (Join-Path $protoDir "archgate.exe")
          $output = & (Join-Path $protoDir "archgate.exe") --version 2>&1
          Write-Host "archgate version from proto dir: $output"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Binary exited with code $LASTEXITCODE"
            exit 1
          }
          # Remove only the fixture this step created. The wider ~/.proto tree
          # holds the moonrepo-installed toolchain that later steps run on.
          Remove-Item -Path (Join-Path $env:USERPROFILE ".proto" "tools" "archgate") -Recurse -Force -ErrorAction SilentlyContinue

      - name: Smoke test binary from node_modules
        shell: pwsh
        run: |
          $projectDir = Join-Path $env:TEMP "archgate-local-smoke"
          $binDir = Join-Path $projectDir "node_modules" ".bin"
          New-Item -Path $binDir -ItemType Directory -Force | Out-Null
          Set-Content -Path (Join-Path $projectDir "package.json") -Value "{}"
          Set-Content -Path (Join-Path $projectDir "bun.lock") -Value ""
          Copy-Item "dist/archgate-smoke-test.exe" (Join-Path $binDir "archgate.exe")
          $output = & (Join-Path $binDir "archgate.exe") --version 2>&1
          Write-Host "archgate version from node_modules: $output"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Binary exited with code $LASTEXITCODE"
            exit 1
          }
          Remove-Item -Path $projectDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build MSIX
        run: bun run build:msix --binary dist/archgate-smoke-test.exe --out-dir dist/msix

      # Windows PowerShell, not pwsh: the Appx module loads natively only there.
      - name: Smoke test MSIX install
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msix = "dist\msix\archgate-win32-x64.msix"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          [xml]$manifest = Get-Content distribution\msix\AppxManifest.xml
          $identity = $manifest.Package.Identity

          # The Store signs the released package. Here a throwaway certificate
          # issued to the manifest's Publisher stands in for that signature.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $identity.Publisher `
            -KeyUsage DigitalSignature -FriendlyName "archgate smoke test" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $cer = Join-Path $env:RUNNER_TEMP "archgate-smoke.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool exited with code $LASTEXITCODE" }

          try {
            Add-AppxPackage -Path $msix

            # The execution alias is what puts `archgate` on PATH.
            $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\archgate.exe"
            if (-not (Test-Path $alias)) { throw "Execution alias not created at $alias" }

            $output = & $alias --version
            Write-Host "MSIX archgate version: $output"
            if ($LASTEXITCODE -ne 0) { throw "Packaged binary exited with code $LASTEXITCODE" }
            if ("$output" -notmatch [regex]::Escape($version)) { throw "Expected version $version in output" }

            $doctor = (& $alias doctor --json | Out-String) | ConvertFrom-Json
            Write-Host "Detected install method: $($doctor.archgate.install_method)"
            if ($doctor.archgate.install_method -ne "msstore") {
              throw "Expected install method msstore, got $($doctor.archgate.install_method)"
            }
          } finally {
            Get-AppxPackage -Name $identity.Name | Remove-AppxPackage
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }

      # A stub stands in for winget: the real one would install from the Store.
      - name: Smoke test install.ps1 winget delegation
        shell: pwsh
        env:
          CI: ""
        run: |
          $stubDir = Join-Path $env:RUNNER_TEMP "winget-stub"
          New-Item -Path $stubDir -ItemType Directory -Force | Out-Null
          $argsFile = Join-Path $stubDir "args.txt"
          Set-Content -Path (Join-Path $stubDir "winget.cmd") -Value "@echo %* > `"$argsFile`"`r`n@exit /b 0"
          $env:Path = "$stubDir;$env:Path"

          $output = & "$env:GITHUB_WORKSPACE\install.ps1" *>&1 | Out-String
          Write-Host $output

          $storeId = (Get-Content distribution/msix/store.json -Raw | ConvertFrom-Json).productId
          $expected = "install --id $storeId --source msstore"
          $actual = if (Test-Path $argsFile) { (Get-Content $argsFile -Raw).Trim() } else { "" }
          if ($actual -ne $expected) {
            Write-Error "Expected install.ps1 to run 'winget $expected', got '$actual'"
            exit 1
          }
          if ($output -match "Using the direct download") {
            Write-Error "install.ps1 fell back to the direct download after winget succeeded"
            exit 1
          }

      - name: Smoke test install.ps1
        shell: pwsh
        env:
          ARCHGATE_VERSION: ${{ vars.LATEST_RELEASE_TAG || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:ARCHGATE_VERSION) {
            # Find the newest release that already has the Windows asset uploaded.
            # On release-commit pushes the Validate and Release workflows start
            # concurrently, so the latest tag may exist before its binaries are
            # uploaded by release-binaries.yml — hitting a 404.
            $asset = "archgate-win32-x64.zip"
            $tags = gh release list --limit 5 --json tagName --jq '.[].tagName' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $tags) {
              Write-Host "::warning::No releases found, skipping install.ps1 smoke test"
              exit 0
            }
            $found = $false
            foreach ($tag in $tags -split "`n") {
              $tag = $tag.Trim()
              if (-not $tag) { continue }
              $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
              if ($assets -match [regex]::Escape($asset)) {
                $env:ARCHGATE_VERSION = $tag
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "::warning::No release with $asset found, skipping install.ps1 smoke test"
              exit 0
            }
          }
          Write-Host "Testing install.ps1 with version $env:ARCHGATE_VERSION"

          $installDir = Join-Path $env:TEMP "archgate-smoke-install-$(Get-Random)"
          $env:ARCHGATE_INSTALL_DIR = $installDir

          & "$env:GITHUB_WORKSPACE\install.ps1"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "install.ps1 exited with code $LASTEXITCODE"
            exit 1
          }

          $exe = Join-Path $installDir "archgate.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "archgate.exe not found at $exe after install"
            exit 1
          }

          $output = & $exe --version 2>&1
          Write-Host "Installed archgate version: $output"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installed binary exited with code $LASTEXITCODE"
            exit 1
          }

          Remove-Item -Path $installDir -Recurse -Force -ErrorAction SilentlyContinue
